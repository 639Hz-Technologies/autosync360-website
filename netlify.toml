[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Private field tool stays out of search results. (Lot pages, lot media and unsubscribe pages are served
# by functions, which set their own noindex headers.)
[[headers]]
  for = "/leads"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/leads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Unknown industry pages get a real 404 (pre-rendered pages are served first).
[[redirects]]
  from = "/industries/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
