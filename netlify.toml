[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Private field tool + per-dealer lot pages stay out of search results.
[[headers]]
  for = "/leads"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Unknown industry pages get a real 404 (pre-rendered pages are served first).
[[redirects]]
  from = "/industries/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
